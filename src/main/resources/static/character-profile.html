<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Profile</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #cfd8dc; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #263238; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.7); }
    h1 { color: #82b1ff; text-shadow: 0 0 8px #2962ff; margin-top: 0; }
    .profile-header { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
    .profile-header img { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 3px solid #406aeb; }
    .profile-name { font-size: 2.5em; font-weight: bold; }
    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .detail-item { background: #37474f; padding: 15px; border-radius: 4px; }
    .detail-item strong { display: block; color: #bbdefb; margin-bottom: 5px; text-transform: uppercase; font-size: 0.8em; }
    .mission-card { border: 1px solid #455a64; padding: 15px; border-radius: 4px; margin-top: 20px; }
    .mission-card h3 { margin-top: 0; color: #82b1ff; }
    .actions { margin-top: 30px; text-align: right; }
    .btn { padding: 10px 20px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; text-decoration: none; display: inline-block; }
    .edit-btn { background-color: #0d47a1; color: #bbdefb; margin-right: 10px; }
    .edit-btn:hover { background-color: #2962ff; }
    .delete-btn { background-color: #b71c1c; color: #ffcdd2; }
    .delete-btn:hover { background-color: #d32f2f; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #82b1ff; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Navigation link to return to the main character list -->
  <a href="./characters.html" class="back-link">&larr; Back to Character List</a>

  <!-- Main container for the profile, hidden by default until data is loaded -->
  <div class="container" id="profile-container" style="display:none;">
    <!-- Header section with the character's image and name -->
    <div class="profile-header">
      <img id="char-image" src="" alt="Character Image">
      <div>
        <h1 id="char-name"></h1>
        <div id="char-faction-rank"></div>
      </div>
    </div>

    <!-- Grid for displaying core character details -->
    <div class="details-grid">
      <div class="detail-item">
        <strong>Email</strong>
        <span id="char-email"></span>
      </div>
      <div class="detail-item">
        <strong>Age</strong>
        <span id="char-age"></span>
      </div>
      <div class="detail-item">
        <strong>Homeland</strong>
        <span id="char-homeland"></span>
      </div>
    </div>

    <!-- Container for the assigned mission details -->
    <div id="mission-details"></div>

    <!-- Action buttons for editing and deleting the character -->
    <div class="actions">
      <a href="#" id="edit-btn" class="btn edit-btn">Edit</a>
      <button id="delete-btn" class="btn delete-btn">Delete</button>
    </div>
  </div>

<script>
  // --- CONFIGURATION & API ENDPOINTS ---
  const CHARACTER_API_URL = "http://localhost:8181/character";

  // --- DOM ELEMENTS ---
  const profileContainer = document.getElementById("profile-container");

  // --- FUNCTIONS ---

  /**
   * Retrieves the character's UUID from the URL query parameters (e.g., ?id=...).
   * @returns {string|null} The character ID or null if not found.
   */
  function getCharacterId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  /**
   * The main function to load and display the character profile.
   * It fetches the character data from the API and populates the HTML elements.
   */
  async function loadCharacterProfile() {
    const id = getCharacterId();
    if (!id) {
      // If no ID is found in the URL, redirect back to the list page as this page is invalid.
      window.location.href = './characters.html';
      return;
    }

    try {
      const res = await fetch(`${CHARACTER_API_URL}/list/${id}`);
      if (!res.ok) throw new Error('Character not found');
      const char = await res.json();

      // Populate the page with the fetched character data
      document.getElementById("char-image").src = char.imageUrl || 'https://via.placeholder.com/150';
      document.getElementById("char-name").textContent = char.name;
      document.getElementById("char-faction-rank").textContent = `${char.faction} - ${char.rank}`;
      document.getElementById("char-email").textContent = char.email;
      document.getElementById("char-age").textContent = char.age;
      document.getElementById("char-homeland").textContent = char.homeland || 'N/A';

      // Dynamically build and display the mission details card
      const missionContainer = document.getElementById("mission-details");
      if (char.mission) {
        missionContainer.innerHTML = `
          <div class="mission-card">
            <h3>Assigned Mission</h3>
            <div class="details-grid">
              <div class="detail-item"><strong>Title:</strong> ${char.mission.title}</div>
              <div class="detail-item"><strong>Status:</strong> ${char.mission.status}</div>
            </div>
          </div>
        `;
      } else {
        missionContainer.innerHTML = '<div class="mission-card"><p>No mission assigned.</p></div>';
      }

      // Set up the action buttons
      // The Edit button links to the form page, passing the character's ID.
      document.getElementById("edit-btn").href = `./character-form.html?id=${char.id}`;
      // The Delete button is assigned an onclick event to trigger the delete function.
      document.getElementById("delete-btn").onclick = () => deleteCharacter(char.id);

      // Finally, make the main profile container visible.
      profileContainer.style.display = 'block';

    } catch (error) {
      console.error("Failed to load character profile:", error);
      alert("Could not load character profile. Redirecting to list.");
      window.location.href = './characters.html';
    }
  }

  /**
   * Handles the character deletion process.
   * @param {string} id - The UUID of the character to delete.
   */
  async function deleteCharacter(id) {
    // Ask for user confirmation before proceeding with a destructive action.
    if (confirm("Are you sure you want to permanently delete this character?")) {
      try {
        const res = await fetch(`${CHARACTER_API_URL}/delete/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error('Failed to delete character');
        alert('Character deleted successfully.');
        window.location.href = './characters.html'; // Redirect to the list page after deletion
      } catch (error) {
        console.error("Error deleting character:", error);
        alert("Could not delete the character.");
      }
    }
  }

  // --- PAGE INITIALIZATION ---

  /**
   * The entry point for the script. Fires when the page's DOM is fully loaded.
   */
  document.addEventListener("DOMContentLoaded", loadCharacterProfile);
</script>

</body>
</html>
